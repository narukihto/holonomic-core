name: ARK-Penta-V Sovereign Integrity Pipeline

on:
  push:
    branches: [ ark ]
  pull_request:
    branches: [ ark ]

env:
  CARGO_TERM_COLOR: always

jobs:
  sovereign-verification:
    name: Formal Mathematical and Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sovereign State
        uses: actions/checkout@v4

      - name: Setup Sovereign Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Build Dependencies
        uses: swatinem/rust-cache@v2

      - name: Audit Formal Syntax
        run: cargo fmt --all -- --check

      - name: Zero-Tolerance Static Analysis
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Mathematical Integrity and Invariant Verification
        run: cargo test --verbose

      - name: Sovereign Stress Test
        run: |
          cargo test --test holonomic_stress_tests
          cargo test --test quantum_manifolds_tests

      - name: Sovereign Benchmark
        run: cargo bench

      - name: Archive Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: manifold-benchmark-report
          path: target/criterion/

      - name: Sovereign Release Build
        run: |
          cargo build --release --verbose
          strip target/release/ark_penta_v_core || true

      - name: Security Audit
        run: cargo run --example lwe_compliance_test
