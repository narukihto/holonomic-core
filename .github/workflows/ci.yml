name: ARK-Penta-V Sovereign Integrity Pipeline

on:
  push:
    branches: [ Tension ]
  pull_request:
    branches: [ Tension ]

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Audit, Integration & Math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --verbose --release --test integration_suite --test quantum_manifolds_tests --lib

  test-chaos:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --test holonomic_stress_tests test_ultimate_random_chaos_100k --release -- --test-threads=1 --nocapture

  test-p-vs-np-boundary:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --test holonomic_stress_tests test_nphard_p_vs_np_equivalence_boundary --release -- --test-threads=1 --nocapture

  test-absolute-break-100k:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --test holonomic_stress_tests test_tsp_nphard_absolute_break_100k --release -- --test-threads=1 --nocapture

  test-fractal:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --test holonomic_stress_tests test_clustered_fractal_trap_100k --release -- --test-threads=1 --nocapture

  test-ring:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --test holonomic_stress_tests test_monolithic_ring_symmetry_100k --release -- --test-threads=1 --nocapture

  test-germany:
    needs: audit
    runs-on: audit
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --test holonomic_stress_tests test_historic_germany_d15112_exact_match --release -- --test-threads=1 --nocapture

  sovereign-finalization:
    name: Build & Security Audit
    runs-on: ubuntu-latest
    needs: [test-chaos, test-p-vs-np-boundary, test-absolute-break-100k, test-fractal, test-ring, test-germany]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Sovereign Benchmark
        timeout-minutes: 5
        run: cargo bench -- --nocapture || echo "Benchmark timed out, skipping..."
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/
        continue-on-error: true
      - name: Sovereign Release Build
        run: |
          cargo build --release --verbose
          strip target/release/ark_penta_v_core || true
      - name: Security Audit
        run: cargo run --example lwe_compliance_test --release
