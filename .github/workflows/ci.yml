name: ARK-Penta-V Sovereign Integrity Pipeline

on: [push, pull_request]

jobs:
  # 1. التدقيق العام (سريع جداً)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # 2. الاختبارات (موزعة لضمان عدم التعليق)
  test-chaos:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test holonomic_stress_tests test_ultimate_random_chaos_100k --release -- --test-threads=1

  test-fractal:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test holonomic_stress_tests test_clustered_fractal_trap_100k --release -- --test-threads=1

  test-ring:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test holonomic_stress_tests test_monolithic_ring_symmetry_100k --release -- --test-threads=1

  test-germany:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test holonomic_stress_tests test_historic_germany_d15112_exact_match --release -- --test-threads=1
