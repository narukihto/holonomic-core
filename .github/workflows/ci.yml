name: ARK-Penta-V Sovereign Integrity Pipeline

on:
  push:
    branches: [ Tension ]
  pull_request:
    branches: [ Tension ]

env:
  CARGO_TERM_COLOR: always

jobs:
  sovereign-verification:
    name: Formal Mathematical and Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Sovereign State
        uses: actions/checkout@v4

      - name: Setup Sovereign Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Build Dependencies
        uses: swatinem/rust-cache@v2

      - name: Audit Formal Syntax
        run: cargo fmt --all -- --check

      - name: Zero-Tolerance Static Analysis
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Mathematical Integrity and Invariant Verification
        run: cargo test --verbose --release --lib

      - name: Sovereign Stress Test (Holonomic & Germany Match)
        run: cargo test --test holonomic_stress_tests --release -- --test-threads=1

      - name: Sovereign Benchmark
        run: cargo bench -- --nocapture

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/

      - name: Sovereign Release Build
        run: |
          cargo build --release --verbose
          strip target/release/ark_penta_v_core || true

      - name: Security Audit
        run: cargo run --example lwe_compliance_test --release
